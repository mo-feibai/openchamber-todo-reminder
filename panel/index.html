<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办提醒</title>
<style>
  /* Layout only — colors come from the host theme via applyHostReady.
   * Font stack is pinned to the host app body rule verbatim (same engine +
   * same stack = same glyphs), instead of trusting theme token vars. */
  body { margin: 0; padding: 12px; }
  /* Author display beats the hidden attribute's UA rule — restore it. */
  [hidden] { display: none !important; }
  body .oc-sdk, body .oc-sdk button, body .oc-sdk input,
  body .oc-sdk select, body .oc-sdk textarea {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .muted-line { opacity: .65; font-size: 12px; margin: 4px 0; }
  #errSlot { margin: 8px 0; }
  #errSlot:empty { margin: 0; }
</style>
</head>
<body>
  <div id="head"></div>
  <div class="muted-line" id="sub"></div>
  <div id="todos"></div>
  <div id="pickerSlot" class="row" hidden><span class="grow" style="flex:0 0 auto">手动选择</span><span class="grow" id="picker"></span></div>
  <div id="sep1"></div>
  <div id="tabs"></div>
  <div id="onceRow" class="row"><span class="grow" id="minutesField"></span><span>分钟后</span></div>
  <div id="dailyRow" class="row" hidden><span class="grow" id="clockField"></span></div>
  <div class="row" id="addRow"></div>
  <div id="sep2"></div>
  <div id="remsHead"></div>
  <div id="rems"></div>
  <div class="row" id="selRow" hidden><span class="grow" id="selDesc"></span><span id="delBtn"></span></div>
  <div class="row" id="footRow"></div>
  <div class="muted-line" id="svc"></div>
  <div id="errSlot"></div>
  <script src="./main.js"></script>
</body>
</html>
